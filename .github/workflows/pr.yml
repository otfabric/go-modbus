# The pull request gate (otfabric/.github PR workflow), generated by
# otfabric/.github scripts/rollout/pr-workflow.py. No path filter: the light
# checks always run, the heavy ones unless the change is documentation only,
# then "OT Fabric Required Checks", the only check a ruleset requires.
name: PR
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    uses: otfabric/.github/.github/workflows/pr-changes.yml@v3.8.0

  ci:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  docs:
    permissions:
      contents: read
    uses: ./.github/workflows/docs.yml
    secrets: inherit

  interop:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/interop.yml
    secrets: inherit

  required:
    name: OT Fabric Required Checks
    needs: [changes, docs, ci, interop]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: otfabric/.github/actions/required-gate@v3.8.0
        with:
          needs: ${{ toJSON(needs) }}
          required: changes docs
          required-for-code: ci interop
