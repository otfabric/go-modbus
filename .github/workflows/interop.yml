name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

# Runs go-modbus against the reference implementations published by
# otfabric/modbus-interop, as client and as server. The images are consumed as
# published: nothing of modbus-interop is cloned or built here.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      libmodbus_image:
        description: "libmodbus reference image (default: the pinned release)"
        required: false
      pymodbus_image:
        description: "PyModbus reference image (default: the pinned release)"
        required: false
      digitalpetri_image:
        description: "digitalpetri/modbus reference image (default: the pinned release)"
        required: false
      nmodbus_image:
        description: "NModbus reference image (default: the pinned release)"
        required: false
      tokiomodbus_image:
        description: "tokio-modbus reference image (default: the pinned release)"
        required: false

permissions:
  contents: read
  packages: read

env:
  # otfabric/modbus-interop v0.3.2: libmodbus v3.2.0, PyModbus 3.16.1,
  # digitalpetri/modbus 2.1.6, NModbus 3.0.83, tokio-modbus 0.17.0.
  # Pinned by the multi-arch index digests of its release manifest.
  # Keep in step with the Makefile and interop/harness.go.
  MODBUS_INTEROP_LIBMODBUS_IMAGE: ${{ inputs.libmodbus_image || 'ghcr.io/otfabric/modbus-interop-libmodbus@sha256:405c7a3f4317d878fd512ed197ce82c73225c32fa62fee06bcba00afb3b0a14b' }}
  MODBUS_INTEROP_PYMODBUS_IMAGE: ${{ inputs.pymodbus_image || 'ghcr.io/otfabric/modbus-interop-pymodbus@sha256:b41e5218233021929fa9f986c70346c1956eed970b36e26003f75c2381f7f8c8' }}
  MODBUS_INTEROP_DIGITALPETRI_IMAGE: ${{ inputs.digitalpetri_image || 'ghcr.io/otfabric/modbus-interop-digitalpetri@sha256:c28c0ebf295ba84798886c5105887ad7b3ea23fab04ba8dced82a107c53d9f48' }}
  MODBUS_INTEROP_NMODBUS_IMAGE: ${{ inputs.nmodbus_image || 'ghcr.io/otfabric/modbus-interop-nmodbus@sha256:77249db77d8f7e8812c58bf47728a2fb2d340800e925aeb195c3011264063564' }}
  MODBUS_INTEROP_TOKIOMODBUS_IMAGE: ${{ inputs.tokiomodbus_image || 'ghcr.io/otfabric/modbus-interop-tokiomodbus@sha256:1613ed01740a8625f3071b770cef01247455335d41c17c90bc76048ae779ac83' }}
  GOPRIVATE: github.com/otfabric/*

jobs:
  interop:
    name: libmodbus + PyModbus + digitalpetri + NModbus + tokio-modbus, client and server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: |
            go.sum
            **/go.sum

      - name: Configure private module access
        shell: bash
        env:
          TOKEN: ${{ secrets.OTFABRIC_READ_TOKEN }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Pull reference images
        run: |
          images=("${MODBUS_INTEROP_LIBMODBUS_IMAGE}" "${MODBUS_INTEROP_PYMODBUS_IMAGE}" "${MODBUS_INTEROP_DIGITALPETRI_IMAGE}" "${MODBUS_INTEROP_NMODBUS_IMAGE}" "${MODBUS_INTEROP_TOKIOMODBUS_IMAGE}")
          # GHCR is occasionally slow or rate limiting: try each pull a few times.
          for image in "${images[@]}"; do
            for attempt in 1 2 3 4 5; do
              docker pull "${image}" && break
              [[ "${attempt}" == 5 ]] && { echo "::error::cannot pull ${image}"; exit 1; }
              sleep $((attempt * 15))
            done
          done
          {
            echo "| Reference | Image | Upstream |"
            echo "|---|---|---|"
            for image in "${images[@]}"; do
              docker run --rm "${image}" print-capabilities \
                | jq -r --arg image "${image}" '"| \(.adapter) \(.adapterVersion) | `\($image)` | \(.upstream.name) \(.upstream.version) |"'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the interop suite
        run: make interop

      - name: Collect container logs on failure
        if: failure()
        run: |
          mkdir -p artifacts
          docker ps -a > artifacts/docker-ps.txt || true
          for c in $(docker ps -aq --filter name=go-modbus-interop); do
            docker logs "$c" > "artifacts/${c}.log" 2>&1 || true
          done

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: interop-logs
          path: artifacts/
          if-no-files-found: ignore
