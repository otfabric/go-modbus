# Called by pr.yml on every pull request that is not documentation only;
# dispatch it to run it on a branch without a pull request.
name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

# Runs go-modbus against the reference implementations published by
# otfabric/modbus-interop, as client and as server. The images are consumed as
# published: nothing of modbus-interop is cloned or built here.

on:
  workflow_call:
    inputs:
      libmodbus_image:
        description: "libmodbus reference image (default: the pinned release)"
        type: string
        default: ""
      pymodbus_image:
        description: "PyModbus reference image (default: the pinned release)"
        type: string
        default: ""
      digitalpetri_image:
        description: "digitalpetri/modbus reference image (default: the pinned release)"
        type: string
        default: ""
      nmodbus_image:
        description: "NModbus reference image (default: the pinned release)"
        type: string
        default: ""
      tokiomodbus_image:
        description: "tokio-modbus reference image (default: the pinned release)"
        type: string
        default: ""
      j2mod_image:
        description: "j2mod reference image (default: the pinned release)"
        type: string
        default: ""
      jsmodbus_image:
        description: "jsmodbus reference image (default: the pinned release)"
        type: string
        default: ""
      modbusesp_image:
        description: "modbus-esp8266 reference image (default: the pinned release)"
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      libmodbus_image:
        description: "libmodbus reference image (default: the pinned release)"
        required: false
      pymodbus_image:
        description: "PyModbus reference image (default: the pinned release)"
        required: false
      digitalpetri_image:
        description: "digitalpetri/modbus reference image (default: the pinned release)"
        required: false
      nmodbus_image:
        description: "NModbus reference image (default: the pinned release)"
        required: false
      tokiomodbus_image:
        description: "tokio-modbus reference image (default: the pinned release)"
        required: false
      j2mod_image:
        description: "j2mod reference image (default: the pinned release)"
        required: false
      jsmodbus_image:
        description: "jsmodbus reference image (default: the pinned release)"
        required: false
      modbusesp_image:
        description: "modbus-esp8266 reference image (default: the pinned release)"
        required: false

permissions:
  contents: read
  packages: read

env:
  # otfabric/modbus-interop v0.4.1: libmodbus v3.2.0, PyModbus 3.16.1,
  # digitalpetri/modbus 2.1.6, NModbus 3.0.83, tokio-modbus 0.17.0, j2mod 3.4.0,
  # jsmodbus 5.0.0, modbus-esp8266 4.1.1. Pinned by the multi-arch index
  # digests of its release manifest. modbus4j is GPL and never published, so
  # it does not run here (see the Makefile for a local run).
  # Keep in step with the Makefile and interop/harness.go.
  MODBUS_INTEROP_LIBMODBUS_IMAGE: ${{ inputs.libmodbus_image || 'ghcr.io/otfabric/modbus-interop-libmodbus@sha256:ec16dc38fbed42962aac2c3b72162615095c20beb7791c8b5f7d07a878d1cb16' }}
  MODBUS_INTEROP_PYMODBUS_IMAGE: ${{ inputs.pymodbus_image || 'ghcr.io/otfabric/modbus-interop-pymodbus@sha256:048cf2a22fa2473c21d431e224b7feaafc791b596a088af355e2076266afba9c' }}
  MODBUS_INTEROP_DIGITALPETRI_IMAGE: ${{ inputs.digitalpetri_image || 'ghcr.io/otfabric/modbus-interop-digitalpetri@sha256:8a852fc84fd47b5bcfb60dbec2473b55dd388425ee0c983458e871ffab6589a0' }}
  MODBUS_INTEROP_NMODBUS_IMAGE: ${{ inputs.nmodbus_image || 'ghcr.io/otfabric/modbus-interop-nmodbus@sha256:9cef6ff1b8b44da0a0356f5cb2b1a94c763f065f1e07c353469acd18279d8a17' }}
  MODBUS_INTEROP_TOKIOMODBUS_IMAGE: ${{ inputs.tokiomodbus_image || 'ghcr.io/otfabric/modbus-interop-tokiomodbus@sha256:bea1d36c98ba8bec5abb240461ef6f440cebcedcb7879e75cdb02c4a75b3c7aa' }}
  MODBUS_INTEROP_J2MOD_IMAGE: ${{ inputs.j2mod_image || 'ghcr.io/otfabric/modbus-interop-j2mod@sha256:a2618932713d711ac1b0ede20623289b98372116d81228b744c14af5089ad1c4' }}
  MODBUS_INTEROP_JSMODBUS_IMAGE: ${{ inputs.jsmodbus_image || 'ghcr.io/otfabric/modbus-interop-jsmodbus@sha256:0482025a89e68e37708bf10bf6abb1289f10bfebbc58db2dd59c3fd42d72c70d' }}
  MODBUS_INTEROP_MODBUSESP_IMAGE: ${{ inputs.modbusesp_image || 'ghcr.io/otfabric/modbus-interop-modbusesp@sha256:0eaabcafa6605a37c1977552b32979ae1b865ab61f2a44ed27543b5b99ed43cc' }}
  GOPRIVATE: github.com/otfabric/*

jobs:
  interop:
    name: libmodbus + PyModbus + digitalpetri + NModbus + tokio-modbus + j2mod + jsmodbus + modbus-esp8266, client and server
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            **/go.sum

      - name: Configure private module access
        shell: bash
        env:
          TOKEN: ${{ secrets.OTFABRIC_READ_TOKEN }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Pull reference images
        run: |
          images=("${MODBUS_INTEROP_LIBMODBUS_IMAGE}" "${MODBUS_INTEROP_PYMODBUS_IMAGE}" "${MODBUS_INTEROP_DIGITALPETRI_IMAGE}" "${MODBUS_INTEROP_NMODBUS_IMAGE}" "${MODBUS_INTEROP_TOKIOMODBUS_IMAGE}" "${MODBUS_INTEROP_J2MOD_IMAGE}" "${MODBUS_INTEROP_JSMODBUS_IMAGE}" "${MODBUS_INTEROP_MODBUSESP_IMAGE}")
          # GHCR is occasionally slow or rate limiting: try each pull a few times.
          for image in "${images[@]}"; do
            for attempt in 1 2 3 4 5; do
              docker pull "${image}" && break
              [[ "${attempt}" == 5 ]] && { echo "::error::cannot pull ${image}"; exit 1; }
              sleep $((attempt * 15))
            done
          done
          {
            echo "| Reference | Image | Upstream |"
            echo "|---|---|---|"
            for image in "${images[@]}"; do
              docker run --rm "${image}" print-capabilities \
                | jq -r --arg image "${image}" '"| \(.adapter) \(.adapterVersion) | `\($image)` | \(.upstream.name) \(.upstream.version) |"'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the interop suite
        run: make interop

      - name: Collect container logs on failure
        if: failure()
        run: |
          mkdir -p artifacts
          docker ps -a > artifacts/docker-ps.txt || true
          for c in $(docker ps -aq --filter name=go-modbus-interop); do
            docker logs "$c" > "artifacts/${c}.log" 2>&1 || true
          done

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: interop-logs
          path: artifacts/
          if-no-files-found: ignore
