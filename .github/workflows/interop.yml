# Called by pr.yml on every pull request that is not documentation only;
# dispatch it to run it on a branch without a pull request.
name: Interop
run-name: "Interop (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

# Runs go-modbus against the reference implementations published by
# otfabric/modbus-interop, as client and as server. The images are consumed as
# published: nothing of modbus-interop is cloned or built here.

on:
  workflow_call:
    inputs:
      libmodbus_image:
        description: "libmodbus reference image (default: the pinned release)"
        type: string
        default: ""
      pymodbus_image:
        description: "PyModbus reference image (default: the pinned release)"
        type: string
        default: ""
      digitalpetri_image:
        description: "digitalpetri/modbus reference image (default: the pinned release)"
        type: string
        default: ""
      nmodbus_image:
        description: "NModbus reference image (default: the pinned release)"
        type: string
        default: ""
      tokiomodbus_image:
        description: "tokio-modbus reference image (default: the pinned release)"
        type: string
        default: ""
      j2mod_image:
        description: "j2mod reference image (default: the pinned release)"
        type: string
        default: ""
      jsmodbus_image:
        description: "jsmodbus reference image (default: the pinned release)"
        type: string
        default: ""
      modbusesp_image:
        description: "modbus-esp8266 reference image (default: the pinned release)"
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      libmodbus_image:
        description: "libmodbus reference image (default: the pinned release)"
        required: false
      pymodbus_image:
        description: "PyModbus reference image (default: the pinned release)"
        required: false
      digitalpetri_image:
        description: "digitalpetri/modbus reference image (default: the pinned release)"
        required: false
      nmodbus_image:
        description: "NModbus reference image (default: the pinned release)"
        required: false
      tokiomodbus_image:
        description: "tokio-modbus reference image (default: the pinned release)"
        required: false
      j2mod_image:
        description: "j2mod reference image (default: the pinned release)"
        required: false
      jsmodbus_image:
        description: "jsmodbus reference image (default: the pinned release)"
        required: false
      modbusesp_image:
        description: "modbus-esp8266 reference image (default: the pinned release)"
        required: false

permissions:
  contents: read
  packages: read

env:
  # otfabric/modbus-interop v0.4.2: libmodbus v3.2.0, PyModbus 3.16.1,
  # digitalpetri/modbus 2.1.6, NModbus 3.0.83, tokio-modbus 0.17.0, j2mod 3.4.0,
  # jsmodbus 5.0.0, modbus-esp8266 4.1.1. Pinned by the multi-arch index
  # digests of its release manifest. modbus4j is GPL and never published, so
  # it does not run here (see the Makefile for a local run).
  # Keep in step with the Makefile and interop/harness.go.
  MODBUS_INTEROP_LIBMODBUS_IMAGE: ${{ inputs.libmodbus_image || 'ghcr.io/otfabric/modbus-interop-libmodbus@sha256:da13c28adc0b00383d93d71b6cd70883d3673b12a171ffc260a7bb97aa75fd50' }}
  MODBUS_INTEROP_PYMODBUS_IMAGE: ${{ inputs.pymodbus_image || 'ghcr.io/otfabric/modbus-interop-pymodbus@sha256:e780cc28e6aaba3f79117521f1f8dd9f29768d1d6dbcb39c6169dcf5062bac37' }}
  MODBUS_INTEROP_DIGITALPETRI_IMAGE: ${{ inputs.digitalpetri_image || 'ghcr.io/otfabric/modbus-interop-digitalpetri@sha256:cc54df3a528f79cfe3bdb18f8e4d136dd829f566d1044610705d416e30f1c06b' }}
  MODBUS_INTEROP_NMODBUS_IMAGE: ${{ inputs.nmodbus_image || 'ghcr.io/otfabric/modbus-interop-nmodbus@sha256:66af7261c1dff13a7e7f391049748e71cc0d46008a1004b7de12549e02c9760d' }}
  MODBUS_INTEROP_TOKIOMODBUS_IMAGE: ${{ inputs.tokiomodbus_image || 'ghcr.io/otfabric/modbus-interop-tokiomodbus@sha256:34860cd1c7200e32a0111853564d640b62e4bfc89d7c833d39ab3f1e7aa3a3ce' }}
  MODBUS_INTEROP_J2MOD_IMAGE: ${{ inputs.j2mod_image || 'ghcr.io/otfabric/modbus-interop-j2mod@sha256:14cbe8953bc66fc1da77cc7673da00b9c2b99fef446558ee77914e5540394445' }}
  MODBUS_INTEROP_JSMODBUS_IMAGE: ${{ inputs.jsmodbus_image || 'ghcr.io/otfabric/modbus-interop-jsmodbus@sha256:0d02076d4a8a8707632f8e7ab23b144501ee4ff2d9d7d5592a2ca2a8da48332d' }}
  MODBUS_INTEROP_MODBUSESP_IMAGE: ${{ inputs.modbusesp_image || 'ghcr.io/otfabric/modbus-interop-modbusesp@sha256:1f6b07b332e3108e0b56cc3d631bf96f89a8438b95b98c05445935182f2832a6' }}
  GOPRIVATE: github.com/otfabric/*

jobs:
  interop:
    name: libmodbus + PyModbus + digitalpetri + NModbus + tokio-modbus + j2mod + jsmodbus + modbus-esp8266, client and server
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            **/go.sum

      - name: Configure private module access
        shell: bash
        env:
          TOKEN: ${{ secrets.OTFABRIC_READ_TOKEN }}
        run: git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Pull reference images
        run: |
          images=("${MODBUS_INTEROP_LIBMODBUS_IMAGE}" "${MODBUS_INTEROP_PYMODBUS_IMAGE}" "${MODBUS_INTEROP_DIGITALPETRI_IMAGE}" "${MODBUS_INTEROP_NMODBUS_IMAGE}" "${MODBUS_INTEROP_TOKIOMODBUS_IMAGE}" "${MODBUS_INTEROP_J2MOD_IMAGE}" "${MODBUS_INTEROP_JSMODBUS_IMAGE}" "${MODBUS_INTEROP_MODBUSESP_IMAGE}")
          # GHCR is occasionally slow or rate limiting: try each pull a few times.
          for image in "${images[@]}"; do
            for attempt in 1 2 3 4 5; do
              docker pull "${image}" && break
              [[ "${attempt}" == 5 ]] && { echo "::error::cannot pull ${image}"; exit 1; }
              sleep $((attempt * 15))
            done
          done
          {
            echo "| Reference | Image | Upstream |"
            echo "|---|---|---|"
            for image in "${images[@]}"; do
              docker run --rm "${image}" print-capabilities \
                | jq -r --arg image "${image}" '"| \(.adapter) \(.adapterVersion) | `\($image)` | \(.upstream.name) \(.upstream.version) |"'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the interop suite
        run: make interop

      - name: Collect container logs on failure
        if: failure()
        run: |
          mkdir -p artifacts
          docker ps -a > artifacts/docker-ps.txt || true
          for c in $(docker ps -aq --filter name=go-modbus-interop); do
            docker logs "$c" > "artifacts/${c}.log" 2>&1 || true
          done

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: interop-logs
          path: artifacts/
          if-no-files-found: ignore
